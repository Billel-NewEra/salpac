<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Accordéon Responsive - Démo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --bg-body:#111C44;
      --bg-sidebar:#0C1427;
      --text:#E2E8F0;
      --muted:#94A3B8;
      --accent:#5D87FF;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      height: 100vh;
      background: var(--bg-sidebar);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      border-right: 1px solid rgba(255, 255, 255, .08);
      padding: 1rem;
      transition: transform .3s ease;
      overflow-y: auto;
    }

    .menu-title {
      color: var(--accent);
      font-weight: 600;
      text-align: center;
      margin: .25rem 0 1rem;
    }

    .accordion-button {
      background: none;
      color: var(--muted);
      border: none;
      box-shadow: none;
      padding: .6rem .8rem;
      border-radius: 10px;
    }

    .accordion-button:not(.collapsed) {
      color: var(--accent);
      background: rgba(93, 135, 255, .15);
    }

    .accordion-item {
      background: none;
      border: none;
    }

    .accordion-body {
      padding: 0 0 0 1rem;
    }

    .submenu-link {
      display: block;
      color: var(--muted);
      padding: .5rem 0;
      cursor: pointer;
    }

    .submenu-link:hover {
      color: var(--text);
    }

    /* Hamburger pour mobile */
    .hamburger {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1200;
      background: var(--bg-sidebar);
      border: 1px solid rgba(255, 255, 255, .12);
      color: var(--text);
      border-radius: 10px;
      font-size: 1.35rem;
      padding: .45rem .6rem;
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.show {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

<!-- Hamburger -->
<button class="hamburger" id="hamburger"><i class="bi bi-list"></i></button>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="menu-title">🪄 Menu Accordéon</div>

  <div class="accordion" id="menuAccordion">
    <!-- Accueil -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#accueil">
          <i class="bi bi-house-door-fill me-2"></i> Accueil
        </button>
      </h2>
      <div id="accueil" class="accordion-collapse collapse">
        <div class="accordion-body">
          <span class="submenu-link">Tableau de bord</span>
        </div>
      </div>
    </div>

    <!-- Analyses -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#analyses">
          <i class="bi bi-graph-up me-2"></i> Analyses
        </button>
      </h2>
      <div id="analyses" class="accordion-collapse collapse">
        <div class="accordion-body">
          <span class="submenu-link">Clients</span>
          <span class="submenu-link">Commandes</span>
          <span class="submenu-link">Livraisons</span>
        </div>
      </div>
    </div>

    <!-- Atelier -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#atelier">
          <i class="bi bi-hammer me-2"></i> Atelier
        </button>
      </h2>
      <div id="atelier" class="accordion-collapse collapse">
        <div class="accordion-body">
          <span class="submenu-link">Impression</span>
          <span class="submenu-link">Maintenance</span>
        </div>
      </div>
    </div>
  </div>
</aside>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const hamburger = document.getElementById('hamburger');
  const sidebar = document.getElementById('sidebar');

  hamburger.addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('show');
  });

  document.addEventListener('click', (e) => {
    const isInside = e.target.closest('#sidebar');
    const isBurger = e.target.closest('#hamburger');
    if (!isInside && !isBurger && window.innerWidth <= 768) {
      sidebar.classList.remove('show');
    }
  });
</script>

</body>
</html>
