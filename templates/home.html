<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SALPAC – Bienvenue</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#007bff">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/salpac_icon_192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

  <style>
    /* 🌌 Fond animé */
    body {
      background: linear-gradient(180deg, #0C1427 0%, #111C44 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 15vh;
      align-items: center;
      overflow: hidden;
      color: white;
      position: relative;
    }

    /* 🫧 Bulles */
    .bubbles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -150px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.4); opacity: 0; }
    }

    /* ✨ Logo */
    .hero-logo {
      max-height: 110px;
      filter: drop-shadow(0 0 10px #5D87FF);
      margin-bottom: 1.5rem;
      z-index: 1;
      opacity: 0;
      transform: scale(0.6);
      animation: fadeZoom 0.9s ease-out forwards;
      animation-delay: 0.3s;
    }

    /* Titre & Sous-titre */
    .hero-title, .hero-subtitle {
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      z-index: 1;
      animation: fadeSlideUp 0.8s ease-out forwards;
    }
    .hero-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #E2E8F0;
      margin-bottom: 0.5rem;
      animation-delay: 0.7s;
    }
    .hero-subtitle {
      font-size: 1.1rem;
      color: #94A3B8;
      margin-bottom: 1rem;
      animation-delay: 1s;
    }

    /* 📢 Ligne supplémentaire animée */
    .hero-extra {
      text-align: center;
      color: #cbd5e1;
      font-size: 1rem;
      margin-bottom: 2rem;
      opacity: 0;
      transform: translateY(30px);
      z-index: 1;
      animation: fadeSlideUp 0.8s ease-out forwards;
      animation-delay: 1.2s;
    }
    .hero-extra strong {
      color: #5D87FF;
    }

    /* 🧭 Boutons */
    .hero-actions {
      display: flex;
      gap: 0.8rem;
      z-index: 1;
    }

    .hero-actions .btn {
      padding: 0.65rem 1.5rem;
      font-weight: 600;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(93,135,255,0.45);
      transition: all 0.25s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeSlideUp 0.8s ease-out forwards;
    }

    .hero-actions .btn-primary {
      background: linear-gradient(135deg, #5D87FF 0%, #7C3AED 100%);
      border: none;
      animation-delay: 1.5s;
    }

    .hero-actions .btn-outline-light {
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.05);
      color: #fff;
      animation-delay: 1.8s;
    }

    .hero-actions .btn:hover {
      transform: translateY(-3px) scale(1.03);
    }
    .hero-actions .btn-outline-light:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-color: rgba(255,255,255,0.7);
    }

    /* ✨ Animations apparition */
    @keyframes fadeZoom {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 🦶 Footer amélioré */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: rgba(17, 28, 68, 0.75);
      backdrop-filter: blur(8px) saturate(150%);
      -webkit-backdrop-filter: blur(8px) saturate(150%);
      color: #94A3B8;
      font-size: 0.9rem;
      padding: 1rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 2;
      opacity: 0;
      transform: translateY(40px);
      animation: footerFadeIn 1.2s ease-out forwards;
      animation-delay: 2.4s;
    }

    footer .brand {
      color: #5D87FF;
      font-weight: 600;
      transition: text-shadow 0.4s ease, color 0.4s ease;
    }

    footer .brand:hover {
      text-shadow: 0 0 10px #5D87FF, 0 0 20px #49BEFF;
      color: #7da6ff;
    }

    footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #5D87FF, #49BEFF, transparent);
      background-size: 200% 100%;
      animation: glowLine 4s linear infinite;
    }

    @keyframes footerFadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowLine {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }
  </style>
</head>

<body>

  <!-- 🫧 Bulles en arrière-plan -->
  <div class="bubbles"></div>

  <!-- ✨ Contenu principal -->
  <img src="{{ url_for('static', filename='img/salpac-logo.png') }}" alt="SALPAC" class="hero-logo">
  <h1 class="hero-title">Bienvenue chez SALPAC</h1>
  <p class="hero-subtitle">Spécialiste de l'étuis pliants en carton plat</p>
  <p class="hero-extra">
    Connectez-vous pour suivre vos <strong>commandes</strong> et vos <strong>livraisons</strong>.
  </p>

  <div class="hero-actions">
    <a href="{{ url_for('login') }}" class="btn btn-primary">
      Connexion
    </a>
    <a href="https://www.salpacemballage.com/"
       class="btn btn-outline-light"
       target="_blank"
       rel="noopener noreferrer">
      En savoir plus
    </a>
  </div>

  <footer>
    © 2025 Powered by <span class="brand">MobiPrint</span>
  </footer>

  <!-- 🫧 Script pour bulles -->
  <script>
    const container = document.querySelector('.bubbles');
    for (let i = 0; i < 25; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      const size = Math.random() * 80 + 20;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}%`;
      bubble.style.animationDuration = `${Math.random() * 15 + 10}s`;
      bubble.style.animationDelay = `${Math.random() * 15}s`;
      container.appendChild(bubble);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/salpac/service-worker.js")
        .then(reg => console.log("Service Worker registered, scope:", reg.scope))
        .catch(err => console.error("SW registration failed:", err));
    }
  </script>
</body>
</html>
