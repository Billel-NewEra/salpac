<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>✨ Heatmap Toggle – Design Moderne</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #0b1220, #090e1a 60%, #070b14);
      color: #e6eef8;
      font-family: "Inter", "Poppins", sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
      letter-spacing: 0.2px;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      transition: all 0.35s ease;
      width: 750px;
      position: relative;
      overflow: hidden;
    }

    .chart-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.35);
    }

    .chart-title {
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 1.2rem;
      font-size: 1.15rem;
      text-shadow: 0 0 8px rgba(255,255,255,0.05);
      letter-spacing: .4px;
    }

    .toggle-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    .toggle-btn {
      background: rgba(56,189,248,0.15);
      color: #94a3b8;
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 12px;
      padding: 0.55rem 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .toggle-btn.active {
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      color: #0b1220;
      font-weight: 600;
      box-shadow: 0 0 16px rgba(139,92,246,0.4);
    }

    .fade {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .fade.show {
      opacity: 1;
      transform: translateY(0);
    }

    .apexcharts-legend-text {
      color: #aeb5cc !important;
      font-size: 13px !important;
    }
  </style>
</head>
<body>

  <div class="chart-card">
    <div class="toggle-container">
      <button id="btn-week" class="toggle-btn active">📆 Vue par semaine</button>
      <button id="btn-client" class="toggle-btn">👥 Vue par client</button>
    </div>

    <div id="chartHeatmapWeeks" class="fade show"></div>
    <div id="chartHeatmapClients" class="fade"></div>
  </div>

  <script>
    const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

    /* === HEATMAP PAR SEMAINE === */
    const weeks = ['S40', 'S41', 'S42', 'S43'];
    const dataWeeks = [
      [5, 12, 24, 38, 42, 20, 8],
      [3, 15, 28, 36, 41, 25, 10],
      [2, 18, 32, 44, 40, 22, 5],
      [7, 20, 26, 35, 48, 30, 15]
    ];
    const seriesWeeks = weeks.map((w, i) => ({
      name: w,
      data: days.map((d, j) => ({ x: d, y: dataWeeks[i][j] }))
    }));

    const chartWeeks = new ApexCharts(document.querySelector("#chartHeatmapWeeks"), {
      chart: { type: 'heatmap', height: 380, toolbar: { show: false }, background: 'transparent' },
      series: seriesWeeks,
      plotOptions: {
        heatmap: {
          shadeIntensity: 0.9,
          radius: 6,
          enableShades: true,
          colorScale: {
            ranges: [
              { from: 0, to: 5, color: '#0f172a', name: 'Très faible' },
              { from: 6, to: 15, color: '#14b8a6', name: 'Modérée' },
              { from: 16, to: 30, color: '#06b6d4', name: 'Active' },
              { from: 31, to: 50, color: '#8b5cf6', name: 'Forte' }
            ]
          }
        }
      },
      dataLabels: { enabled: false },
      xaxis: { categories: days, labels: { style: { colors: '#aeb5cc' } } },
      yaxis: { labels: { style: { colors: '#aeb5cc' } } },
      grid: { borderColor: 'rgba(255,255,255,0.05)' },
      legend: { position: 'bottom', labels: { colors: '#aeb5cc' } },
      tooltip: { theme: 'dark', y: { formatter: (v) => `${v} commande${v>1?'s':''}` } }
    });
    chartWeeks.render();

    /* === HEATMAP PAR CLIENT === */
    const clients = ['Jack Design', 'NovaPack', 'EcoPack', 'Print&Go', 'VisuPrint'];
    const dataClients = [
      [2, 5, 10, 22, 30, 18, 4],
      [1, 9, 20, 26, 35, 25, 10],
      [0, 4, 15, 18, 24, 14, 3],
      [2, 7, 12, 20, 28, 18, 5],
      [1, 10, 14, 22, 31, 19, 7]
    ];
    const seriesClients = clients.map((c, i) => ({
      name: c,
      data: days.map((d, j) => ({ x: d, y: dataClients[i][j] }))
    }));

    const chartClients = new ApexCharts(document.querySelector("#chartHeatmapClients"), {
      chart: { type: 'heatmap', height: 380, toolbar: { show: false }, background: 'transparent' },
      series: seriesClients,
      plotOptions: {
        heatmap: {
          shadeIntensity: 0.9,
          radius: 6,
          enableShades: true,
          colorScale: {
            ranges: [
              { from: 0, to: 5, color: '#0f172a', name: 'Très faible' },
              { from: 6, to: 15, color: '#0891b2', name: 'Modérée' },
              { from: 16, to: 30, color: '#06b6d4', name: 'Active' },
              { from: 31, to: 50, color: '#a855f7', name: 'Forte' }
            ]
          }
        }
      },
      dataLabels: { enabled: false },
      xaxis: { categories: days, labels: { style: { colors: '#aeb5cc' } } },
      yaxis: { labels: { style: { colors: '#aeb5cc' } } },
      grid: { borderColor: 'rgba(255,255,255,0.05)' },
      legend: { position: 'bottom', labels: { colors: '#aeb5cc' } },
      tooltip: { theme: 'dark', y: { formatter: (v) => `${v} commande${v>1?'s':''}` } }
    });
    chartClients.render();

    /* === SWITCH LOGIC === */
    const btnWeek = document.getElementById('btn-week');
    const btnClient = document.getElementById('btn-client');
    const chartWeekDiv = document.getElementById('chartHeatmapWeeks');
    const chartClientDiv = document.getElementById('chartHeatmapClients');

    btnWeek.addEventListener('click', () => {
      btnWeek.classList.add('active');
      btnClient.classList.remove('active');
      chartWeekDiv.classList.add('show');
      chartClientDiv.classList.remove('show');
    });

    btnClient.addEventListener('click', () => {
      btnClient.classList.add('active');
      btnWeek.classList.remove('active');
      chartClientDiv.classList.add('show');
      chartWeekDiv.classList.remove('show');
    });
  </script>

</body>
</html>
