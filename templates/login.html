{% extends "base_auth.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}

<div class="card login-card shadow-lg p-4">
  <div class="card-body">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/salpac-logo.png') }}" 
           alt="Logo" 
           style="max-height: 70px; width: auto;" 
           class="mb-3 pop">
      <h3 class="text-light fw-bold">Connexion</h3>
      <p class="text-secondary">Accédez à votre espace</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="mb-3 input-group">
        <span class="input-group-text bg-transparent border-end-0">
          <i class="bi bi-person-fill text-secondary"></i>
        </span>
        <input type="text" class="form-control border-start-0"
               autocomplete="username" id="username" name="username"
               placeholder="Nom d'utilisateur" required>
      </div>

      <div class="mb-3 input-group">
        <span class="input-group-text bg-transparent border-end-0">
          <i class="bi bi-lock-fill text-secondary"></i>
        </span>
        <input type="password" class="form-control border-start-0"
               autocomplete="current-password" id="password" name="password"
               placeholder="Mot de passe" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-2" id="loginBtn">
        Se connecter
      </button>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Connexion...';

    const formData = new FormData(form);

    try {
      const response = await fetch("{{ url_for('login') }}", {
        method: "POST",
        body: formData
      });
      const result = await response.json();

      btn.disabled = false;
      btn.textContent = originalText;

      if (result.success) {
        window.location.href = result.redirect;
      } else {
        showError(result.message);
      }
    } catch (error) {
      btn.disabled = false;
      btn.textContent = originalText;
      showError("Une erreur est survenue. Veuillez réessayer.");
    }
  });

  function showError(message) {
    // SweetAlert2 pour l'erreur
    Swal.fire({
      text: message,
      confirmButtonText: 'OK',
      confirmButtonColor: '#d33',
      background: '#1e1e2f',
      color: '#fff',
      showClass: { popup: 'animate__animated animate__shakeX animate__faster' },
      backdrop: 'rgba(0,0,0,0.6)',
      scrollbarPadding: false
    });

    // ⚡ Réinitialiser uniquement le champ mot de passe
    const passInput = document.getElementById('password');
    passInput.value = '';

    // ✅ Focus auto sur le champ mot de passe
    passInput.focus();

    // Effet visuel
    const userInput = document.getElementById('username');
    userInput.classList.add('input-error');
    passInput.classList.add('input-error');

    setTimeout(() => {
      userInput.classList.remove('input-error');
      passInput.classList.remove('input-error');
    }, 1200);
  }
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

{% endblock %}
