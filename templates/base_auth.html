<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Connexion{% endblock %}</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Ton CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/salpac_icon_192.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      html {
        overflow-y: scroll; /* ✅ Barre fantôme toujours présente → pas de saut */
      }

      body {
        background: var(--bg-body);
        overflow: hidden;
      }

      .swal2-popup {
        font-family: 'Inter', sans-serif;
        border-radius: 0.8rem;
        padding: 1.5rem 2rem;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.25);
      }

      .swal2-title {
        font-size: 1.1rem !important;
        font-weight: 500;
      }

      .swal2-confirm {
        background-color: #0d6efd !important;
        border-radius: 0.5rem !important;
        font-weight: 600;
        padding: 0.5rem 1.2rem;
      }

      .swal2-confirm:focus {
        box-shadow: none !important;
      }

      .input-error {
        border-color: #dc3545 !important;
        box-shadow: 0 0 8px rgba(220, 53, 69, 0.5);
        transition: all 0.3s ease;
      }
       .auth-login-page {
    height: 100vh;           /* hauteur stable */
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg-body);
    overflow: hidden;        /* empêche les mouvements */
  }
  html {
    overflow-y: scroll; /* ✅ barre fantôme → pas de saut */
  }
    </style>
  </head>

  <body class="auth-login-page d-flex justify-content-center align-items-center overflow-hidden">
    {% block content %}{% endblock %}

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <script>
            const iconType =
              '{{ category }}' === 'danger' ? 'error' :
              '{{ category }}' === 'success' ? 'success' : 'info';

            Swal.fire({
              icon: iconType,
              title: '{{ message|escape }}',
              confirmButtonText: 'OK',
              allowOutsideClick: true,
              allowEscapeKey: true,
              backdrop: 'rgba(0,0,0,0.4)',
              scrollbarPadding: false, // ✅ empêche le décalage visuel
              timer: iconType === 'error' ? undefined : 2500,
              timerProgressBar: iconType !== 'error'
            }).then(() => {
              if (iconType === 'error') {
                const userInput = document.getElementById('username');
                const passInput = document.getElementById('password');
                if (userInput) userInput.classList.add('input-error');
                if (passInput) passInput.classList.add('input-error');
                setTimeout(() => {
                  userInput?.classList.remove('input-error');
                  passInput?.classList.remove('input-error');
                }, 1500);
              }
            });
          </script>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/salpac/service-worker.js")
          .then(reg => console.log("Service Worker registered (auth), scope:", reg.scope))
          .catch(err => console.error("SW registration failed (auth):", err));
      }
    </script>
  </body>
</html>
