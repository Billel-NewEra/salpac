<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>✨ Heatmap Glow Soft – NovoPrint Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #0b1220, #090e1a 60%, #070b14);
      color: #e6eef8;
      font-family: "Inter", sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
    }

    .chart-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 1.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      width: 700px;
    }

    .chart-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 18px rgba(56,189,248,0.25);
    }

    .chart-title {
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .apexcharts-legend-text {
      color: #aeb5cc !important;
      font-size: 13px !important;
    }

    /* Glow doux via pseudo */
    .chart-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 50%, rgba(56,189,248,0.06), transparent 70%);
      z-index: -1;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="chart-card">
    <div class="chart-title">💡 Activité hebdomadaire (Glow Soft)</div>
    <div id="heatmapSoft"></div>
  </div>

  <script>
    const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
    const weeks = ['S40', 'S41', 'S42', 'S43'];
    const data = [
      [5, 12, 24, 38, 42, 20, 8],
      [3, 15, 28, 36, 41, 25, 10],
      [2, 18, 32, 44, 40, 22, 5],
      [7, 20, 26, 35, 48, 30, 15]
    ];

    const series = weeks.map((w, i) => ({
      name: w,
      data: days.map((d, j) => ({ x: d, y: data[i][j] }))
    }));

    new ApexCharts(document.querySelector("#heatmapSoft"), {
      chart: { type: 'heatmap', height: 350, toolbar: { show: false }, background: 'transparent' },
      series,
      plotOptions: {
        heatmap: {
          shadeIntensity: 0.8,
          radius: 6,
          colorScale: {
            ranges: [
              { from: 0, to: 5, color: '#1e293b' },
              { from: 6, to: 15, color: '#0891b2' },
              { from: 16, to: 30, color: '#06b6d4' },
              { from: 31, to: 50, color: '#818cf8' }
            ]
          }
        }
      },
      dataLabels: { enabled: false },
      xaxis: { categories: days, labels: { style: { colors: '#aeb5cc' } } },
      yaxis: { labels: { style: { colors: '#aeb5cc' } } },
      grid: { borderColor: 'rgba(255,255,255,0.05)' },
      legend: { position: 'bottom', labels: { colors: '#aeb5cc' } },
      tooltip: { theme: 'dark', y: { formatter: v => `${v} cmd.` } }
    }).render();
  </script>
</body>
</html>
