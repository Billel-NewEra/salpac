{% extends "base_auth.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}

<style>

/* 🌌 Fond premium */
.auth-login-page{
  background: linear-gradient(180deg,#0C1427 0%,#111C44 100%);
  overflow:hidden;
  position:relative;
}

/* 🫧 Bulles animées */
.bubbles{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
}

.bubble{
  position:absolute;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(0) scale(1);opacity:.9;}
  100%{transform:translateY(-120vh) scale(1.4);opacity:0;}
}

/* 🧊 Carte glass */
.login-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  background:rgba(17,28,68,0.65);
  backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  box-shadow:0 25px 50px rgba(0,0,0,0.55);
  animation:fadeUp .7s ease;
}

/* Inputs */
.form-control{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff;
}
.form-control:focus{
  background:rgba(255,255,255,0.08);
  border-color:#5D87FF;
  box-shadow:0 0 10px rgba(93,135,255,.4);
  color:#fff;
}

/* Bouton premium */
.btn-primary{
  background:linear-gradient(135deg,#5D87FF,#7C3AED);
  border:none;
  font-weight:600;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(93,135,255,.45);
  transition:.25s;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(93,135,255,.65);
}

/* apparition */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

.form-control::placeholder{
  color: rgba(151, 148, 148, 0.65) !important;
}

/* 🦶 Footer amélioré */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: rgba(17, 28, 68, 0.75);
      backdrop-filter: blur(8px) saturate(150%);
      -webkit-backdrop-filter: blur(8px) saturate(150%);
      color: #94A3B8;
      font-size: 0.9rem;
      padding: 1rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 2;
      opacity: 0;
      transform: translateY(40px);
      animation: footerFadeIn 1.2s ease-out forwards;
      animation-delay: 1s;
    }

    footer .brand {
      color: #5D87FF;
      font-weight: 600;
      transition: text-shadow 0.4s ease, color 0.4s ease;
    }

    footer .brand:hover {
      text-shadow: 0 0 10px #5D87FF, 0 0 20px #49BEFF;
      color: #7da6ff;
    }

    footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #5D87FF, #49BEFF, transparent);
      background-size: 200% 100%;
      animation: glowLine 4s linear infinite;
    }

    


</style>

<!-- 🫧 Bulles -->
<div class="bubbles" id="bubbles"></div>

<div class="card login-card shadow-lg p-4">
  <div class="card-body">

    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/salpac-logo.png') }}" 
           alt="Logo"
           style="max-height:70px"
           class="mb-3 pop">

      <h3 class="text-light fw-bold">Connexion</h3>
      <p class="text-secondary">Accédez à votre espace</p>
    </div>

    <form id="loginForm">

      <div class="mb-3 input-group">
        <span class="input-group-text bg-transparent border-0">
          <i class="bi bi-person-fill text-secondary"></i>
        </span>
        <input type="text"
               id="username"
               name="username"
               class="form-control"
               placeholder="Nom d'utilisateur"
               required>
      </div>

      <div class="mb-3 input-group">
        <span class="input-group-text bg-transparent border-0">
          <i class="bi bi-lock-fill text-secondary"></i>
        </span>
        <input type="password"
               id="password"
               name="password"
               class="form-control"
               placeholder="Mot de passe"
               required>
      </div>

      <div class="text-center">
        <button class="btn btn-primary px-4 mt-2" id="loginBtn">
          Se connecter
        </button>
      </div>

    </form>
  </div>
</div>

<!-- 🫧 Script bulles (visible direct) -->
<script>
const container=document.getElementById('bubbles');

for(let i=0;i<25;i++){
 const b=document.createElement('div');
 b.classList.add('bubble');

 const s=Math.random()*80+20;
 b.style.width=s+'px';
 b.style.height=s+'px';

 b.style.left=Math.random()*100+'%';
 b.style.bottom=Math.random()*100+'%';

 b.style.animationDuration=(Math.random()*12+8)+'s';
 b.style.animationDelay=(Math.random()*2)+'s';

 container.appendChild(b);
}
</script>

<!-- 🔐 Login JS -->
<script>
const form=document.getElementById('loginForm');
const btn=document.getElementById('loginBtn');

form.addEventListener('submit',async e=>{
 e.preventDefault();

 btn.disabled=true;
 const txt=btn.textContent;
 btn.textContent='Connexion...';

 const r=await fetch("{{ url_for('login') }}",{
   method:"POST",
   body:new FormData(form)
 });

 const j=await r.json();

 btn.disabled=false;
 btn.textContent=txt;

 if(j.success){
   location=j.redirect;
 }else{
   showError(j.message);
 }
});

function showError(message){
 Swal.fire({
   text:message,
   confirmButtonText:'OK',
   confirmButtonColor:'#d33',
   background:'#1e1e2f',
   color:'#fff',
   showClass:{popup:'animate__animated animate__shakeX animate__faster'},
   backdrop:'rgba(0,0,0,0.6)',
   scrollbarPadding:false
 });

 const pass=document.getElementById('password');
 pass.value='';
 pass.focus();
}
</script>

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

 <footer>
  &copy; {{ current_year }} · Powered by <span class="brand">MobiPrint</span>
</footer>
{% endblock %}
