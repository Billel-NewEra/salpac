{% extends "base.html" %}
{% block title %}Créer un utilisateur{% endblock %}
{% block content %}

<!-- Titre -->
<div class="d-flex align-items-center mb-4">
  <i class="bi bi-person-plus-fill fs-4 me-2 text-primary"></i>
  <h2 class="mb-0">Créer un compte client</h2>
</div>

<!-- Carte principale -->
<div class="card widget shadow-sm">
  <div class="card-body p-4">

    <form method="POST">

      <div class="row">
        <!-- Colonne gauche -->
        <div class="col-md-6 pe-md-4">
          <label for="client_id" class="form-label fw-semibold text-light">🏢 Client associé</label>
          <select name="client_id" id="client_id" class="form-select form-select-lg spike-input" required>
            <option value="">-- Choisir un client --</option>
            {% for c in clients %}
              <option value="{{ c.id }}">{{ c.company_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Colonne droite -->
        <div class="col-md-6 ps-md-4">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold text-light">👤 Nom d'utilisateur</label>
            <input type="text" name="username" autocomplete="username" id="username" class="form-control form-control-lg spike-input" required>
          </div>
          <div>
            <label for="password" class="form-label fw-semibold text-light">🔑 Mot de passe</label>
            <input type="password" name="password" autocomplete="new-password" id="password" class="form-control form-control-lg spike-input" required>
          </div>
        </div>
      </div>

      <!-- Boutons centrés -->
      <div class="d-flex justify-content-center gap-3 mt-4">
  <!-- Bouton Annuler -->
  <button type="reset" class="btn btn-cancel-icon btn-sm" title="Annuler">
  <i class="bi bi-x-circle"></i>
</button>

  <!-- Bouton Créer -->
  <button type="submit" class="btn btn-create-icon btn-sm" title="Créer le compte">
    <i class="bi bi-check-circle"></i>
  </button>
</div>

    </form>

  </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
  /* Inputs */
  .spike-input {
    background-color: #1E2746 !important;
    color: #E2E8F0 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    border-radius: 10px !important;
    font-size: 0.9rem !important;
    height: 42px !important;
    transition: all 0.25s ease;
  }
  .spike-input:focus {
    border-color: #5D87FF !important;
    box-shadow: 0 0 6px rgba(93,135,255,0.3) !important;
  }

  /* Select2 */
  .select2-container .select2-selection--single {
    background-color: #1E2746 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    border-radius: 10px !important;
    height: 42px !important;
    display: flex;
    align-items: center;
    font-size: 0.9rem !important;
    color: #E2E8F0 !important;
  }
  .select2-container--default .select2-selection__rendered {
    color: #E2E8F0 !important;
    padding-left: 10px;
  }
  .select2-dropdown {
    background-color: #1E2746 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #E2E8F0 !important;
  }
  .select2-results__option--highlighted {
    background-color: #5D87FF !important;
    color: white !important;
  }

  /* Boutons */
  .btn-outline-light {
    border-color: rgba(255,255,255,0.3);
    color: #E2E8F0;
  }
  .btn-outline-light:hover {
    background-color: rgba(255,255,255,0.1);
  }
</style>

<script>
  $(document).ready(function () {
    $('#client_id').select2({
  placeholder: "🔍 Rechercher un client...",
  allowClear: true,
  width: '100%',
  minimumResultsForSearch: 0  // force la recherche visible
});

$('#client_id').on('select2:open', function () {
  document.querySelector('.select2-container--open .select2-search__field').focus();
});
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const form = document.querySelector("form");
    const select = document.getElementById("client_id");

    if (form && select) {
      form.addEventListener("reset", function() {
        // attend un peu que le reset se fasse
        setTimeout(() => {
          // remet la valeur vide
          select.value = "";
          // si c’est un select2, on force l’UI à refléter le reset
          if ($(select).data('select2')) {
            $(select).val(null).trigger('change');
          }
        }, 0);
      });
    }
  });
</script>

{% endblock %}
