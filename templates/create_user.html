{% extends "base.html" %}
{% block title %}Créer un utilisateur{% endblock %}
{% block content %}

<!-- Titre -->
<div class="d-flex align-items-center mb-4">
  <i class="bi bi-person-plus-fill fs-4 me-2 text-primary"></i>
  <h4 class="mb-0">Créer un compte client</h4>
</div>

<!-- Carte principale -->
<div class="card widget shadow-sm">
  <div class="card-body p-4">

    <form method="POST">

      <div class="row">

  {% if current_user.role == "superadmin" %}
  <!-- RÔLE (superadmin only) -->
  <div class="col-12 mb-3">
    <label class="form-label fw-semibold text-light">Rôle</label>
    <select name="role" id="role" class="form-select spike-input">
      <option value="client" selected>Client</option>
      <option value="admin">Admin</option>
    </select>
  </div>
  {% else %}
    <input type="hidden" name="role" value="client">
  {% endif %}

  <!-- CLIENT ASSOCIÉ -->
  <div class="col-md-6 pe-md-4 mb-4 mb-md-0" id="clientField">
    <label class="form-label fw-semibold text-light">🏢 Client associé</label>
    <select name="client_id" id="client_id"
            class="form-select form-select-lg spike-input">
      <option value="">-- Choisir un client --</option>
      {% for c in clients %}
        <option value="{{ c.id }}">{{ c.company_name }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- USERNAME + PASSWORD -->
  <div class="col-md-6 ps-md-4">
    <div class="mb-4">
      <label class="form-label fw-semibold text-light">👤 Nom d'utilisateur</label>
      <input type="text" name="username"
             class="form-control form-control-lg spike-input" required>
    </div>

    <div>
      <label class="form-label fw-semibold text-light">🔑 Mot de passe</label>
      <input type="password" name="password"
             class="form-control form-control-lg spike-input" required>
    </div>
  </div>

</div>

      <div class="position-relative d-flex align-items-center mt-4">

  <!-- Bouton retour (gauche) -->
  <a href="{{ url_for('list_users') }}"
     class="btn-return-circle"
     title="Retour aux utilisateurs">
    <i class="bi bi-arrow-left"></i>
  </a>

  <!-- Centre réel -->
  <div class="position-absolute start-50 translate-middle-x d-flex gap-3">
    <button type="reset" class="btn btn-cancel-icon btn-sm">
      <i class="bi bi-x-circle"></i>
    </button>

    <button type="submit" class="btn btn-create-icon btn-sm">
      <i class="bi bi-check-circle"></i>
    </button>
  </div>

</div>

    </form>

  </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
  /* Inputs */
  .spike-input {
    background-color: #1E2746 !important;
    color: #E2E8F0 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    border-radius: 10px !important;
    font-size: 0.9rem !important;
    height: 42px !important;
    transition: all 0.25s ease;
  }
  .spike-input:focus {
    border-color: #5D87FF !important;
    box-shadow: 0 0 6px rgba(93,135,255,0.3) !important;
  }

  /* Select2 */
  .select2-container .select2-selection--single {
    background-color: #1E2746 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    border-radius: 10px !important;
    height: 42px !important;
    display: flex;
    align-items: center;
    font-size: 0.9rem !important;
    color: #E2E8F0 !important;
  }
  .select2-container--default .select2-selection__rendered {
    color: #E2E8F0 !important;
    padding-left: 10px;
  }
  .select2-dropdown {
    background-color: #1E2746 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #E2E8F0 !important;
  }
  .select2-results__option--highlighted {
    background-color: #5D87FF !important;
    color: white !important;
  }

  /* Boutons */
  .btn-outline-light {
    border-color: rgba(255,255,255,0.3);
    color: #E2E8F0;
  }
  .btn-outline-light:hover {
    background-color: rgba(255,255,255,0.1);
  }

  .form-label {
  margin-bottom: 0.4rem;
  letter-spacing: 0.02em;
}

@media (max-width: 768px) {
  .card-body form .row > div {
    margin-bottom: 1rem;
  }
}
</style>

<script>
  $(document).ready(function () {
    $('#client_id').select2({
  placeholder: "🔍 Rechercher un client...",
  allowClear: true,
  width: '100%',
  minimumResultsForSearch: 0  // force la recherche visible
});

$('#client_id').on('select2:open', function () {
  document.querySelector('.select2-container--open .select2-search__field').focus();
});
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const form = document.querySelector("form");
    const select = document.getElementById("client_id");

    if (form && select) {
      form.addEventListener("reset", function() {
        // attend un peu que le reset se fasse
        setTimeout(() => {
          // remet la valeur vide
          select.value = "";
          // si c’est un select2, on force l’UI à refléter le reset
          if ($(select).data('select2')) {
            $(select).val(null).trigger('change');
          }
        }, 0);
      });
    }
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", function(){

  const roleSelect = document.getElementById("role");
  const clientField = document.getElementById("clientField");

  if(roleSelect){
    function toggleClientField(){
      if(roleSelect.value === "admin"){
        clientField.style.display = "none";
      } else {
        clientField.style.display = "block";
      }
    }

    toggleClientField();
    roleSelect.addEventListener("change", toggleClientField);
  }

});
</script>

{% endblock %}
