<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pagination Premium</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
  :root {
    --bg-card: #1E2746;
    --text: #94A3B8;
    --text-strong: #E2E8F0;
    --primary: #5D87FF;
    --primary-gradient: linear-gradient(135deg, #5D87FF 0%, #7C3AED 100%);
  }

  body {
    background: #111C44;
    font-family: Inter, sans-serif;
    color: var(--text);
    padding: 2rem;
  }

  .pagination .page-link {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 0.45rem 0.85rem;
    margin: 0 4px;
    border-radius: 50px;
    transition: all 0.25s ease-in-out;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .pagination .page-link:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text-strong);
    transform: translateY(-2px);
  }

  .pagination .page-item.active .page-link {
    background: var(--primary-gradient);
    border: none;
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(93,135,255,0.45);
  }

  .pagination .page-item.disabled .page-link {
    background: rgba(255,255,255,0.04);
    color: #666;
    border: none;
  }
  </style>
</head>
<body>

  <div class="card p-4" style="background: var(--bg-card); border-radius:16px;">
    <h5 class="mb-3">Exemple Pagination Premium</h5>
    <nav aria-label="Pagination démo">
      <ul class="pagination justify-content-center mb-0">
        <li class="page-item disabled">
          <span class="page-link"><i class="bi bi-arrow-left"></i></span>
        </li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item active"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">4</a></li>
        <li class="page-item"><a class="page-link" href="#">5</a></li>
        <li class="page-item">
          <a class="page-link" href="#"><i class="bi bi-arrow-right"></i></a>
        </li>
      </ul>
    </nav>
  </div>

</body>
</html>
